# ============================================================
#  Appium Android Framework — Configuration File
#  Location: src/test/resources/configs/config.properties
# ============================================================

# --- Appium Server ---
# The URL where Appium Server is running locally
appium.server.url=http://127.0.0.1:4723

# --- Platform ---
platform.name=Android

# --- Android Device / Emulator ---
# deviceName: The AVD name (from: avdmanager list avd)
device.name=Pixel_8_API_35
# udid: The device serial from: adb devices
# Leave as 'emulator-5554' for default single emulator
udid=emulator-5554

# --- Android Version ---
platform.version=15.0

# --- Application Under Test ---
# Relative path from project root OR absolute path
app.path=src/test/resources/apps/mda-2.2.0-25.apk
# For testing an already-installed app, use appPackage + appActivity instead:
app.package=com.saucelabs.mydemoapp.android
app.activity=com.saucelabs.mydemoapp.android.view.activities.SplashActivity

# --- Automation Engine ---
automation.name=UiAutomator2

# --- Timeouts (seconds) ---
implicit.wait=10
explicit.wait=20
page.load.timeout=30

# --- Test Data ---
# Default test credentials (for sample login test)
test.username=bob@example.com
test.password=10203040

# --- Report ---
report.title=Appium Android Test Report
report.name=Android Automation Suite
extent.report.path=test-output/ExtentReport.html

# --- Screenshot on Failure ---
screenshot.on.failure=true
screenshot.path=test-output/screenshots/

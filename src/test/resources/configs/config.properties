# ============================================================
#  Appium Cross-Platform Framework — Configuration File
#  Location: src/test/resources/configs/config.properties
# ============================================================

# --- Target Platform Switch ---
# Options: android | ios
target.platform=android

# --- Appium Server ---
appium.server.url=http://127.0.0.1:4723
# Hybrid Server Control: true = Auto-start local server | false = Connect to static URL (manual / CI)
appium.auto.start.server=false

# ============================================================
#  ANDROID CONFIGURATION
# ============================================================
android.platform.name=Android
android.device.name=Pixel_8_API_35
android.udid=emulator-5554
android.platform.version=15.0
android.automation.name=UiAutomator2
android.app.path=
android.app.package=com.wdiodemoapp
android.app.activity=com.wdiodemoapp.MainActivity
android.app.wait.activity=*

# ============================================================
#  iOS CONFIGURATION
# ============================================================
ios.platform.name=iOS
ios.device.name=iPhone 17
ios.udid=
ios.platform.version=26.5
ios.automation.name=XCUITest
ios.app.path=src/test/resources/apps/My Demo App.app
ios.bundle.id=com.saucelabs.mydemoapp.ios

# ============================================================
#  TIMEOUTS (seconds)
# ============================================================
implicit.wait=10
explicit.wait=20
page.load.timeout=30

# ============================================================
#  TEST DATA & CREDENTIALS
# ============================================================
test.username=bob@example.com
test.password=10203040

# ============================================================
#  REPORTING & SCREENSHOTS
# ============================================================
report.title=Appium Cross-Platform Test Report
report.name=Mobile Automation Suite
allure.results.path=target/allure-results
screenshot.on.failure=true
screenshot.path=test-output/screenshots/
